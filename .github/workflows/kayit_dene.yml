name: Kayıt dosyası dene
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dene:
    runs-on: ubuntu-latest
    steps:
      - run: |
          kod(){ python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$1"; }
          for G in 2026-11-27 2026-11-29 2026-11-30 2026-12-01; do
            D=$(date -d $G +%d.%m.%Y)
            for S in "İstanbul" "İzmir" "Bursa" "Ankara" "Adana" "Antalya" "Elazığ" "Kocaeli" "Şanlıurfa" "Diyarbakır"; do
              for K in CSV PDF; do
                for T in KayitListesi GunlukKayitListesi Kayitlar KayitDeklare KayitBilgileri YarisKayitlari KosuKayitlari GunlukKayit Kayit GunlukYarisProgrami; do
                  for X in csv pdf; do
                    Y="/raporftp/TJKPDF/${G:0:4}/$G/$K/$T/$D-$S-$T-TR.$X"
                    C=$(curl -s -o /tmp/f -w '%{http_code}' -A Mozilla/5.0 "https://medya-cdn.tjk.org$(kod "$Y")")
                    if [ "$C" = "200" ] && ! grep -qi "<html" /tmp/f; then echo "VAR $Y $(stat -c%s /tmp/f)"; fi
                  done
                done
              done
            done
          done
