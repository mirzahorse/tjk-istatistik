name: TJK verisini güncelle

on:
  schedule:
    - cron: "17 * * * *"   # her saat (xx:17); GitHub saat başlarında yoğun olduğu için 17. dakika
  workflow_dispatch:        # Actions sekmesinden elle ya da dış zamanlayıcıyla (cron-job.org) çalıştırılır
    inputs:
      kaynak:
        description: "elle | zamanlayici"
        default: "elle"
        required: false
      gun:
        description: "Kaç gün geriye bakılsın (0 = yılın tamamı; boş = otomatik)"
        default: ""
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tjk-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      degisti: ${{ steps.kaydet.outputs.degisti }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sonuçları TJK'dan indir (bugün ve dün yenilenir)
        run: |
          # her saat yalnızca bugün ve dün; günde bir kez (06:17) ve elle çalıştırınca son 7 gün
          if [ -n "${{ inputs.gun }}" ]; then GUN="${{ inputs.gun }}"; elif [ "$(date -u +%H)" = "03" ] || [ "${{ inputs.kaynak }}" = "elle" ]; then GUN=7; else GUN=2; fi
          python3 tjk_indir.py --klasor veri --gun $GUN

      - name: Sitenin veri dosyasını yeniden oluştur
        run: python3 build_site.py veri site

      - name: Değişiklik varsa kaydet
        id: kaydet
        run: |
          git config user.name "tjk-guncelleme"
          git config user.email "actions@users.noreply.github.com"
          git add veri site/data.js
          if git diff --cached --quiet; then
            echo "Yeni sonuç yok."
          else
            git commit -m "Veri güncellendi: $(date -u +%Y-%m-%d)"
            git pull --rebase -q && git push
            echo "degisti=1" >> "$GITHUB_OUTPUT"
          fi

  # Siteyi paketle (veri değiştiyse ya da elle çalıştırıldıysa; zamanlayıcıda yalnızca veri değiştiyse)
  paketle:
    needs: guncelle
    if: needs.guncelle.outputs.degisti == '1' || inputs.kaynak == 'elle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # GitHub Pages'te yayınla; GitHub tarafındaki geçici hatalara karşı bir kez yeniden dener
  yayinla:
    needs: paketle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin2.outputs.page_url || steps.yayin.outputs.page_url }}
    steps:
      - id: yayin
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.yayin.outcome == 'failure'
        run: sleep 45
      - id: yayin2
        if: steps.yayin.outcome == 'failure'
        uses: actions/deploy-pages@v4
