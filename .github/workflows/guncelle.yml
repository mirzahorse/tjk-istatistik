name: TJK verisini güncelle

on:
  schedule:
    - cron: "17 * * * *"   # her saat (xx:17); GitHub saat başlarında yoğun olduğu için 17. dakika
  workflow_dispatch:        # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write

concurrency:
  group: tjk-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sonuçları TJK'dan indir (bugün ve dün yenilenir)
        run: |
          # her saat yalnızca bugün ve dün; günde bir kez (06:17) ve elle çalıştırınca son 7 gün
          if [ "$(date -u +%H)" = "03" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then GUN=7; else GUN=2; fi
          python3 tjk_indir.py --klasor veri --gun $GUN

      - name: Sitenin veri dosyasını yeniden oluştur
        run: python3 build_site.py veri site

      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "tjk-guncelleme"
          git config user.email "actions@users.noreply.github.com"
          git add veri site/data.js
          if git diff --cached --quiet; then
            echo "Yeni sonuç yok."
          else
            git commit -m "Veri güncellendi: $(date -u +%Y-%m-%d)"
            git pull --rebase -q && git push
          fi
