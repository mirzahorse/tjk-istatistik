<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TJK 2026 İstatistikleri</title>
<style>
:root{--bg:#f7f6f3;--panel:#fff;--fg:#1f1f1d;--mut:#6b6a66;--line:#e4e2dc;--acc:#2f6f4f;--acc2:#a8d5ba;--bad:#b3412e;--good:#2f7d4f;--r:10px}
@media (prefers-color-scheme:dark){:root{--bg:#191917;--panel:#232321;--fg:#ecebe7;--mut:#a3a29d;--line:#383734;--acc:#6cc193;--acc2:#2f5a43;--bad:#e07a66;--good:#6cc193}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:20px 20px 0;max-width:1180px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px;font-weight:650}
.sub{color:var(--mut);font-size:13px;margin:0}
nav{display:flex;gap:4px;overflow-x:auto;max-width:1180px;margin:16px auto 0;padding:0 20px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);font:inherit;font-weight:550;padding:10px 12px;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--fg);border-color:var(--acc)}
main{max-width:1180px;margin:0 auto;padding:16px 20px 40px}
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.filters label,.ctl label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
select,input{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
.btn{font:inherit;font-size:13px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:7px 10px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .k{font-size:12px;color:var(--mut)}.tile .v{font-size:26px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;margin-bottom:14px}
.grid .card{margin-bottom:0}
.grid+.card,.card+.grid,.grid+.grid{margin-top:14px}
.card h2{font-size:16px;margin:0 0 2px;font-weight:620}
.card .d{font-size:13px;color:var(--mut);margin:0 0 10px}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end;margin-bottom:10px}
.tw{overflow-x:auto}.tw.tall{max-height:460px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;font-weight:600;color:var(--mut);border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap;position:sticky;top:0;background:var(--panel)}
td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.r{text-align:right}.pos{color:var(--good);font-weight:600}.neg{color:var(--bad);font-weight:600}
.empty{color:var(--mut);font-size:13px;padding:10px 0}
svg text{fill:var(--mut);font-size:11px}svg .val{fill:var(--fg);font-size:11px;font-weight:600}
svg .bar{fill:var(--acc)}svg .bar2{fill:var(--acc2)}svg .grd{stroke:var(--line)}svg .ln{stroke:var(--acc);stroke-width:2;fill:none}svg .dot{fill:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{font-size:13px;border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:4px 10px;cursor:pointer}
.chip.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.leg{font-size:12px;color:var(--mut);display:flex;gap:14px;margin-top:6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
footer{max-width:1180px;margin:0 auto;padding:0 20px 30px;color:var(--mut);font-size:12px}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>TJK 2026 İstatistikleri</h1>
<p class="sub" id="ozetSatir">Yükleniyor…</p>
</header>
<nav id="sekmeler">
<button data-tab="genel" class="on">Genel</button>
<button data-tab="atlar">Atlar</button>
<button data-tab="insan">Jokey &amp; Antrenör</button>
<button data-tab="yetis">Yetiştiricilik</button>
<button data-tab="kosul">Koşu koşulları</button>
<button data-tab="sonuc">Sonuçlar</button>
</nav>
<main>
<div class="filters" id="filtreler">
<label>Başlangıç<input type="date" id="f_bas"></label>
<label>Bitiş<input type="date" id="f_bit"></label>
<label>Hipodrom<select id="f_hip"></select></label>
<label>Pist<select id="f_pist"></select></label>
<label>Irk<select id="f_irk"></select></label>
<label>Mesafe<select id="f_mes"></select></label>
<label>Koşu türü<select id="f_tur"></select></label>
<label>Yaş<select id="f_yas"><option value="">Tümü</option><option value="2">2 yaşlı</option><option value="3">3 yaşlı</option><option value="4">4 yaşlı</option><option value="5">5 ve yukarı</option></select></label>
<label>Cinsiyet<select id="f_cins"><option value="">Tümü</option><option>Erkek</option><option>Dişi</option></select></label>
<button class="btn" id="temizle">Temizle</button>
</div>
<div id="icerik"></div>
</main>
<footer id="dipnot"></footer>
<script src="data.js"></script>
<script>
if (!window.TJK_DATA) {
  document.getElementById('ozetSatir').textContent = 'Veri dosyası (data.js) bulunamadı. index.html ile data.js aynı klasörde olmalı.';
  document.getElementById('ozetSatir').style.color = '#b3412e';
  throw new Error('data.js yüklenemedi');
}
</script>
<script>
"use strict";
// ---------- veri ----------
const RAW = window.TJK_DATA, Dc = RAW.dict, R = RAW.races, S = RAW.starts;
const AY = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const races = R.t.map((_, i) => ({
  i, tarih: Dc.t[R.t[i]], hip: Dc.h[R.h[i]], no: R.no[i], ad: Dc.ad[R.ad[i]], sinif: Dc.sn[R.sn[i]], tur: Dc.tur[R.tur[i]],
  irk: Dc.irk[R.irk[i]], mes: R.m[i], pist: Dc.p[R.p[i]], rekor: Dc.rek[R.rek[i]], ikr: R.ikr[i], saat: Dc.saat[R.saat[i]], n: R.n[i]
}));
for (const r of races) { const d = new Date(r.tarih + 'T12:00:00'); r.dow = d.getDay(); r.saatH = parseInt(r.saat, 10); }
const rows = S.r.map((ri, i) => {
  const rc = races[ri], s = S.s[i];
  return {
    rc, sira: Math.abs(s), derecesiz: s < 0, at: Dc.at[S.at[i]], baba: Dc.ba[S.ba[i]], anne: Dc.an[S.an[i]], yas: S.y[i], renk: Dc.rk[S.rk[i]],
    cins: Dc.c[S.c[i]], kilo: S.kg[i] / 10, fazla: S.fz[i] / 10, jokey: Dc.j[S.j[i]], ap: S.ap[i] === 1, sahip: Dc.sh[S.sh[i]], antr: Dc.tr[S.an2[i]],
    st: S.st[i], ds: S.ds[i] === 1, agf: S.agf[i], hp: S.hp[i] < 0 ? null : S.hp[i], sn: S.sn[i] < 0 ? null : S.sn[i] / 100,
    g: S.g[i] < 0 ? null : S.g[i] / 100, fark: Dc.f[S.f[i]], ekip: Dc.e[S.e[i]], yeni: Dc.e[S.ye[i]], ara: S.ara[i]
  };
});
for (const r of rows) { r.k = r.at + '|' + r.baba + '|' + r.anne; r.w = r.sira === 1; r.i3 = r.sira <= 3 && !r.derecesiz; }
// favori: koşudaki en düşük ganyan
const minG = new Map();
for (const r of rows) if (r.g > 0 && (!minG.has(r.rc.i) || r.g < minG.get(r.rc.i))) minG.set(r.rc.i, r.g);
for (const r of rows) r.fav = r.g > 0 && r.g === minG.get(r.rc.i);

// ---------- biçim ----------
const nf = new Intl.NumberFormat('tr-TR'), nf1 = new Intl.NumberFormat('tr-TR', {minimumFractionDigits: 1, maximumFractionDigits: 1}), nf2 = new Intl.NumberFormat('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const N = (v) => nf.format(v), P = (v) => '%' + nf1.format(v), M = (v) => nf1.format(v / 1e6) + ' mn ₺';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const tarih = (s) => { const [y, m, d] = s.split('-'); return `${+d} ${AY[+m - 1]} ${y}`; };
const derece = (sn) => { if (sn == null) return '—'; const m = Math.floor(sn / 60), s = sn - m * 60; return `${m}.${s.toFixed(2).padStart(5, '0')}`; };
const U = (s) => String(s || '').toLocaleUpperCase('tr').trim();
const pct = (w, s) => (s ? 100 * w / s : 0);
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);

// ---------- istatistik yardımcıları ----------
// grup: {start, bir, i3, ikr, oyn (ganyanlı start), don (kazananların ganyan toplamı)}
function grupla(list, keyf) {
  const m = new Map();
  for (const r of list) {
    const k = keyf(r); if (k == null || k === '') continue;
    let o = m.get(k); if (!o) { o = {k, start: 0, bir: 0, i3: 0, ikr: 0, oyn: 0, don: 0, atlar: new Set(), kazAt: new Set()}; m.set(k, o); }
    o.start++; o.atlar.add(r.k);
    if (r.w) { o.bir++; o.ikr += r.rc.ikr; o.kazAt.add(r.k); }
    if (r.i3) o.i3++;
    if (r.g > 0) { o.oyn++; if (r.w) o.don += r.g; }
  }
  for (const o of m.values()) { o.yuzde = pct(o.bir, o.start); o.kar = o.don - o.oyn; o.roi = o.oyn ? 100 * o.kar / o.oyn : 0; }
  return [...m.values()];
}
const oranlar = (list, keyf, keys) => { const g = new Map(grupla(list, keyf).map((o) => [o.k, o])); return keys.map((k) => ({k, ...(g.get(k) || {start: 0, bir: 0, yuzde: 0})})); };

// ---------- grafikler (SVG) ----------
function cubuk(data, o = {}) { // data: [{k, v, alt}]
  if (!data.length || !data.some((d) => d.v > 0)) return '<div class="empty">Bu filtrelerle veri yok.</div>';
  const W = 560, H = o.h || 210, ml = 8, mb = 34, mt = 18, bw = (W - ml) / data.length, max = Math.max(...data.map((d) => d.v)) || 1;
  const f = o.fmt || N;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.aria || '')}">`;
  data.forEach((d, i) => {
    const h = (H - mb - mt) * d.v / max, x = ml + i * bw + bw * 0.15, w = bw * 0.7, y = H - mb - h;
    s += `<rect class="${d.ikinci ? 'bar2' : 'bar'}" x="${x}" y="${y}" width="${w}" height="${Math.max(h, 0.5)}" rx="2"><title>${esc(d.k)}: ${esc(f(d.v))}${d.alt ? ' · ' + esc(d.alt) : ''}</title></rect>`;
    if (bw > 30) s += `<text class="val" x="${x + w / 2}" y="${y - 4}" text-anchor="middle">${esc(f(d.v))}</text>`;
    s += `<text x="${x + w / 2}" y="${H - mb + 14}" text-anchor="middle">${esc(d.k)}</text>`;
    if (d.alt && bw > 44) s += `<text x="${x + w / 2}" y="${H - mb + 27}" text-anchor="middle">${esc(d.alt)}</text>`;
  });
  return s + '</svg>';
}
function yatay(data, o = {}) {
  if (!data.length) return '<div class="empty">Bu filtrelerle veri yok.</div>';
  const W = 560, bh = 24, H = data.length * bh + 4, lw = o.lw || 110, max = Math.max(...data.map((d) => d.v)) || 1, f = o.fmt || N;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.aria || '')}">`;
  data.forEach((d, i) => {
    const y = 2 + i * bh, w = (W - lw - 70) * d.v / max;
    s += `<text x="${lw - 8}" y="${y + bh / 2 + 4}" text-anchor="end">${esc(d.k)}</text><rect class="bar" x="${lw}" y="${y + 4}" width="${Math.max(w, 1)}" height="${bh - 8}" rx="2"><title>${esc(d.k)}: ${esc(f(d.v))}</title></rect><text class="val" x="${lw + w + 6}" y="${y + bh / 2 + 4}">${esc(f(d.v))}</text>`;
  });
  return s + '</svg>';
}
function cizgi(pts, o = {}) { // pts: [{x: label, y}]
  if (pts.length < 2) return '<div class="empty">Grafik için en az iki değer gerekiyor.</div>';
  const W = 560, H = 200, ml = 34, mr = 10, mt = 14, mb = 26;
  const ys = pts.map((p) => p.y), lo = Math.min(...ys), hi = Math.max(...ys), pad = Math.max(2, (hi - lo) * 0.1), y0 = lo - pad, y1 = hi + pad;
  const X = (i) => ml + (W - ml - mr) * (pts.length === 1 ? 0.5 : i / (pts.length - 1)), Y = (v) => mt + (H - mt - mb) * (1 - (v - y0) / (y1 - y0));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.aria || '')}">`;
  for (const t of [y0, (y0 + y1) / 2, y1]) s += `<line class="grd" x1="${ml}" x2="${W - mr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${ml - 4}" y="${Y(t) + 4}" text-anchor="end">${Math.round(t)}</text>`;
  s += `<polyline class="ln" points="${pts.map((p, i) => X(i) + ',' + Y(p.y)).join(' ')}"/>`;
  pts.forEach((p, i) => { s += `<circle class="dot" cx="${X(i)}" cy="${Y(p.y)}" r="3.5"><title>${esc(p.x)}: ${p.y}</title></circle>`; });
  const step = Math.ceil(pts.length / 6);
  pts.forEach((p, i) => { if (i % step === 0 || i === pts.length - 1) s += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${esc(p.x)}</text>`; });
  return s + '</svg>';
}
function tablo(cols, list, o = {}) { // cols: [[başlık, fn(row), sağa?, sınıf fn?]]
  if (!list.length) return `<div class="empty">${o.bos || 'Bu filtrelerle sonuç yok.'}</div>`;
  let s = `<div class="tw${o.tall ? ' tall' : ''}"><table><thead><tr>${cols.map((c) => `<th${c[2] ? ' class="r"' : ''}>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>`;
  list.forEach((r, i) => { s += '<tr>' + cols.map((c) => { const v = c[1](r, i), cl = [c[2] ? 'r' : '', c[3] ? c[3](r) : ''].filter(Boolean).join(' '); return `<td${cl ? ` class="${cl}"` : ''}>${esc(v)}</td>`; }).join('') + '</tr>'; });
  return s + '</tbody></table></div>';
}
const kart = (baslik, aciklama, govde, id = '') => `<section class="card"${id ? ` id="${id}"` : ''}><h2>${esc(baslik)}</h2>${aciklama ? `<p class="d">${esc(aciklama)}</p>` : ''}${govde}</section>`;
const kutu = (k, v, s = '') => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div>${s ? `<div class="s">${esc(s)}</div>` : ''}</div>`;
const karCls = (r) => (r.kar > 0 ? 'pos' : r.kar < 0 ? 'neg' : '');

// ---------- filtreler ----------
const F = {bas: '', bit: '', hip: '', pist: '', irk: '', mes: '', tur: '', yas: '', cins: ''};
const $ = (id) => document.getElementById(id);
function doldur(id, vals, ilk = 'Tümü') { $(id).innerHTML = `<option value="">${ilk}</option>` + vals.map((v) => `<option value="${esc(v)}">${esc(v)}</option>`).join(''); }
const uniq = (f) => [...new Set(races.map(f))];
doldur('f_hip', uniq((r) => r.hip).sort((a, b) => a.localeCompare(b, 'tr')));
doldur('f_pist', ['Kum', 'Çim', 'Sentetik']);
doldur('f_irk', ['İngiliz', 'Arap']);
doldur('f_mes', uniq((r) => r.mes).sort((a, b) => a - b).map(String));
doldur('f_tur', ['Maiden', 'Şartlı', 'Handikap', 'Kısa Vade Handikap', 'KV', 'Satış', 'Grup 1', 'Grup 2', 'Grup 3', 'Amatör'].filter((t) => uniq((r) => r.tur).includes(t)));
for (const id of ['f_bas', 'f_bit']) { $(id).min = RAW.ilk; $(id).max = RAW.son; }
const FID = {bas: 'f_bas', bit: 'f_bit', hip: 'f_hip', pist: 'f_pist', irk: 'f_irk', mes: 'f_mes', tur: 'f_tur', yas: 'f_yas', cins: 'f_cins'};
for (const [k, id] of Object.entries(FID)) $(id).addEventListener('change', () => { const el = $(id); if (el.type === 'date' && el.value && !el.validity.valid) return; F[k] = el.value; ciz(); });
$('temizle').addEventListener('click', () => { for (const [k, id] of Object.entries(FID)) { F[k] = ''; $(id).value = ''; } ciz(); });

let cache = {key: '', list: rows};
function suzulmus() {
  const key = JSON.stringify(F);
  if (cache.key === key) return cache.list;
  const list = rows.filter((r) => {
    const c = r.rc;
    return (!F.bas || c.tarih >= F.bas) && (!F.bit || c.tarih <= F.bit) && (!F.hip || c.hip === F.hip) && (!F.pist || c.pist === F.pist) &&
      (!F.irk || c.irk === F.irk) && (!F.mes || c.mes === +F.mes) && (!F.tur || c.tur === F.tur) &&
      (!F.yas || (F.yas === '5' ? r.yas >= 5 : r.yas === +F.yas)) && (!F.cins || r.cins === F.cins);
  });
  cache = {key, list};
  return list;
}

// ---------- sekmeler ----------
let sekme = 'genel';
const durum = {atAra: '', atSec: '', grup: 'jokey', olcut: 'bir', kisiAra: '', aygirAra: '', kisrakAra: ''};
document.querySelectorAll('#sekmeler button').forEach((b) => b.addEventListener('click', () => {
  sekme = b.dataset.tab; document.querySelectorAll('#sekmeler button').forEach((x) => x.classList.toggle('on', x === b)); ciz(); history.replaceState(null, '', '#' + sekme);
}));

function genel(L) {
  const kos = new Set(L.map((r) => r.rc.i)), atW = new Map();
  for (const r of L) atW.set(r.k, (atW.get(r.k) || false) || r.w);
  const kazanamayan = [...atW.values()].filter((v) => !v).length;
  const fav = L.filter((r) => r.fav), ikr = sum(L.filter((r) => r.w), (r) => r.rc.ikr);
  let h = '<div class="tiles">' + kutu('Koşu', N(kos.size), N(new Set(L.map((r) => r.rc.tarih + r.rc.hip)).size) + ' yarış gününde') +
    kutu('Koşan at', N(atW.size), N(L.length) + ' start') + kutu('Hiç kazanamayan at', N(kazanamayan), P(pct(kazanamayan, atW.size)) + "'i") +
    kutu('Favori kazanma', P(pct(fav.filter((r) => r.w).length, fav.length)), 'En düşük ganyanlı at') + kutu('Dağıtılan 1.lik ikramiyesi', M(ikr)) + '</div>';
  // aylık
  const ay = new Map(); for (const r of L) { const k = r.rc.tarih.slice(0, 7); if (!ay.has(k)) ay.set(k, new Set()); ay.get(k).add(r.rc.i); }
  const ayD = [...ay].sort().map(([k, s]) => ({k: AY[+k.slice(5) - 1], v: s.size}));
  const hp = new Map(); for (const r of L) { if (!hp.has(r.rc.hip)) hp.set(r.rc.hip, new Set()); hp.get(r.rc.hip).add(r.rc.i); }
  const hpD = [...hp].map(([k, s]) => ({k, v: s.size})).sort((a, b) => b.v - a.v);
  h += '<div class="grid">' + kart('Aylara göre koşu sayısı', '', cubuk(ayD, {aria: 'Aylık koşu sayısı'})) + kart('Hipodromlara göre koşu sayısı', '', yatay(hpD, {aria: 'Hipodrom bazında koşu sayısı'})) + '</div>';
  // kazanamayan dağılımı
  const cnt = new Map(), won = new Set(); for (const r of L) { cnt.set(r.k, (cnt.get(r.k) || 0) + 1); if (r.w) won.add(r.k); }
  const b = new Array(10).fill(0); for (const [k, c] of cnt) if (!won.has(k)) b[Math.min(c, 10) - 1]++;
  // kazanma farkı
  const kazananlar = L.filter((r) => r.w);
  const FB = [['Burun–Baş', /^(Burun|Kısa Baş|Baş|At Başı)$/], ['Boyun', /^Boyun$/], ['Yarım–1 boy', /^(Yarım Boy|1 Boy)$/], ['1,5–3 boy', /^(1,5|2|2,5|3) Boy$/], ['3,5–5 boy', /^(3,5|4|4,5|5) Boy$/], ['5+ boy', /^\d+(,5)? Boy$/]];
  const fb = FB.map(([k]) => ({k, v: 0}));
  for (const r of kazananlar) { const i = FB.findIndex(([, re]) => re.test(r.fark)); if (i >= 0) fb[i].v++; }

function atlar(L) {

  for (const r of [...L].sort((a, b) => (a.rc.tarih < b.rc.tarih ? -1 : 1))) if (r.hp != null) { const o = hpm.get(r.k) || {k: r.k, ilk: r.hp, son: r.hp, n: 0}; o.son = r.hp; o.n++; hpm.set(r.k, o); }

  h += '<div class="grid">' + kart('Seri yapanlar', 'Son koşularını üst üste kazanan atlar.', tablo([['At', (o) => o.k.split('|')[0]], ['Üst üste galibiyet', (o) => o.seri, 1], ['Son koşu', (o) => tarih(o.son)]], seri, {bos: 'Şu an 2+ galibiyet serisi olan at yok.'})) +
    kart('Galibiyetten uzaklaşanlar', 'Daha önce kazanmış ama son galibiyetinden beri en çok koşan atlar.', tablo([['At', (o) => o.k.split('|')[0]], ['Galibiyetsiz koşu', (o) => o.sonraki, 1], ['Son koşu', (o) => tarih(o.son)]], kuraklik)) + '</div>';

  const fz = oranlar(L, (r) => (r.fazla > 0 ? 'Fazla kilolu' : 'Normal'), ['Normal', 'Fazla kilolu']);

  const ara = oranlar(L, (r) => (AB.find(([, a, z]) => r.ara >= a && r.ara <= z) || [])[0], AB.map((b) => b[0]));

  const der = [...m.values()].sort((a, b) => a.r.rc.hip.localeCompare(b.r.rc.hip, 'tr') || a.r.rc.pist.localeCompare(b.r.rc.pist, 'tr') || a.r.rc.mes - b.r.rc.mes);

    kart('AGF sırasına göre kazanma', 'AGF: ganyan oynanışına göre atın sırası.', cubuk(bar(agf), {fmt: P, aria: 'AGF sırasına göre kazanma'})) + '</div>';
  h += '<div class="grid">' + kart('Start numarasına göre kazanma', 'Mesafe ve pist filtresiyle birlikte bakınca daha anlamlı.', cubuk(st.map((o) => ({k: o.k, v: o.yuzde})), {fmt: (v) => nf1.format(v), aria: 'Start numarasına göre kazanma yüzdesi'})) +
    kart('Dış start', 'Dış starttan çıkan atların kazanma oranı.', cubuk(bar(ds), {fmt: P, aria: 'Dış start kazanma'})) + '</div>';
  h += '<div class="grid">' + kart('Taşınan kiloya göre kazanma', 'Handikapta iyi atlara daha çok kilo verildiği için ağır kilolu atlar daha sık kazanır.',cubuk(bar(kilo), {fmt: P, aria: 'Kiloya göre kazanma'})) + kart('Fazla kilo', 'Jokey kilosu nedeniyle fazla kilo taşıyan atlar.', cubuk(bar(fz), {fmt: P, aria: 'Fazla kilo etkisi'})) + '</div>';
  h += '<div class="grid">' + kart('Dinlenme süresi', 'Önceki koşusundan bu yana geçen gün (yıl içi).', cubuk(bar(ara), {fmt: P, aria: 'Dinlenme süresine göre kazanma'})) +
    kart('Saat ve gün', '', cubuk(bar(saat).concat(bar(gun).map((d) => ({...d, ikinci: 1}))), {fmt: P, aria: 'Saat ve güne göre kazanma'})) + '</div>';
  h += kart('Ekipman etkisi', 'Ekipmanlı atların kazanma oranı, ekipmansızlarla ve ekipmanın ilk takıldığı koşuyla karşılaştırması.', tablo([['Ekipman', (o) => o.c + (o.ad !== o.c ? ' · ' + o.ad : '')], ['Start', (o) => N(o.n), 1], ['Takılıyken', (o) => P(o.var), 1], ['Takılmamışken', (o) => P(o.yok), 1], ['İlk takıldığında', (o) => (o.ilkN ? P(o.ilk) + ' (' + N(o.ilkN) + ')' : '—'), 1]], ek));
  h += kart('En iyi dereceler', 'Her hipodrom, pist ve mesafe için en iyi derece; yeşil olanlar pist rekoruna eşit ya da daha iyi.', tablo([['Hipodrom', (o) => o.r.rc.hip], ['Pist', (o) => o.r.rc.pist], ['Mesafe', (o) => N(o.r.rc.mes), 1], ['En iyi derece', (o) => derece(o.sn), 0, (o) => (rs(o.r.rc.rekor) != null && o.sn <= rs(o.r.rc.rekor) + 0.001 ? 'pos' : '')], ['At', (o) => o.r.at], ['Tarih', (o) => tarih(o.r.rc.tarih)], ['Pist rekoru', (o) => o.r.rc.rekor || '—']], der, {tall: 1}));
  return h;
}

function sonuc(L) {
  const byRace = new Map(); for (const r of L) { if (!byRace.has(r.rc.i)) byRace.set(r.rc.i, []); byRace.get(r.rc.i).push(r); }
  const list = [...byRace.entries()].map(([i, a]) => ({rc: races[i], a: a.sort((x, y) => x.sira - y.sira)})).sort((x, y) => (x.rc.tarih < y.rc.tarih ? 1 : x.rc.tarih > y.rc.tarih ? -1 : x.rc.hip.localeCompare(y.rc.hip, 'tr') || y.rc.no - x.rc.no)).slice(0, 60);
  const ilk = (o, n) => o.a.find((r) => r.sira === n && !r.derecesiz);
  return kart('Son koşular', 'Filtrelere uyan en yeni 60 koşu.', tablo([['Tarih', (o) => tarih(o.rc.tarih)], ['Hipodrom', (o) => o.rc.hip], ['Koşu', (o) => o.rc.no, 1], ['Koşu adı / sınıf', (o) => (o.rc.ad ? o.rc.ad + ' · ' : '') + o.rc.sinif], ['Mesafe', (o) => N(o.rc.mes) + ' ' + o.rc.pist], ['1.', (o) => ilk(o, 1)?.at || '—'], ['Derece', (o) => derece(ilk(o, 1)?.sn)], ['Ganyan', (o) => (ilk(o, 1)?.g ? nf2.format(ilk(o, 1).g) : '—'), 1], ['Jokey', (o) => ilk(o, 1)?.jokey || '—'], ['2.', (o) => ilk(o, 2)?.at || '—'], ['3.', (o) => ilk(o, 3)?.at || '—']], list, {tall: 1}));
}

// ---------- çizim ----------
function ciz() {
  const L = suzulmus(), el = $('icerik');
  el.innerHTML = {genel, atlar, insan, yetis, kosul, sonuc}[sekme](L);
  if (sekme === 'atlar') { atKarnesi(); baglaArama('atAra', 'atAra', atKarnesi); }
  if (sekme === 'insan') {
    kisiKarnesi(); baglaArama('kisiAra', 'kisiAra', kisiKarnesi);
    $('s_grup').addEventListener('change', (e) => { durum.grup = e.target.value; ciz(); });
    $('s_olcut').addEventListener('change', (e) => { durum.olcut = e.target.value; ciz(); });
  }
  if (sekme === 'yetis') { aygirKarnesi(); kisrakKarnesi(); baglaArama('aygirAra', 'aygirAra', aygirKarnesi); baglaArama('kisrakAra', 'kisrakAra', kisrakKarnesi); }
  const f = Object.values(F).filter(Boolean).length;
  $('ozetSatir').textContent = `${tarih(RAW.ilk)} – ${tarih(RAW.son)} · ${N(new Set(L.map((r) => r.rc.i)).size)} koşu · ${N(L.length)} start${f ? ' · ' + f + ' filtre açık' : ''}`;
}
function baglaArama(id, key, fn) {
  const el = $(id); if (!el) return; let t;
  el.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { durum[key] = el.value; fn(); }, 300); });
}
$('dipnot').textContent = `Kaynak: TJK resmi günlük sonuç dosyaları (medya-cdn.tjk.org). Koşmayan atlar hariç. İkramiye yalnızca birincilik ikramiyesidir. Atlar ad + baba + anne ile ayırt edilir. Son yarış günü: ${tarih(RAW.son)}. Bu sayfa bağımsızdır, TJK ile bağlantısı yoktur.`;
const h0 = location.hash.slice(1); if (['genel', 'atlar', 'insan', 'yetis', 'kosul', 'sonuc'].includes(h0)) { sekme = h0; document.querySelectorAll('#sekmeler button').forEach((x) => x.classList.toggle('on', x.dataset.tab === h0)); }
ciz();
</script>
